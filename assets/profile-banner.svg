
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300"
     viewBox="0 0 1200 300">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101318"/>
      <stop offset="100%" stop-color="#171F2A"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#294663"/>
      <stop offset="100%" stop-color="#527CA8"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none"
            stroke="#7897B8" stroke-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#background)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <g transform="translate(1010 150)" fill="none" stroke="#527CA8">
    <circle r="105" stroke-opacity="0.18"/>
    <circle r="82" stroke-opacity="0.25"/>
    <circle r="58" stroke-opacity="0.35"/>
    <circle r="34" stroke-opacity="0.45"/>
    <path d="M-125 0H125 M0 -125V125" stroke-opacity="0.3"/>
    <path d="M-90 -90L90 90 M90 -90L-90 90"
          stroke-opacity="0.15"/>
    <circle r="5" fill="#527CA8" stroke="none"/>
  </g>

  <rect x="65" y="48" width="42" height="3" fill="url(#blue)"/>

  <g fill="#7897B8" font-family="Arial, Helvetica, sans-serif"
     font-size="11" letter-spacing="3">
    <text x="120" y="53">PERSONAL ENGINEERING JOURNAL</text>
    <text x="1135" y="53" text-anchor="end">01 / 2026</text>
  </g>

  <text x="65" y="145" fill="#E2E8EF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68" font-weight="700"
        letter-spacing="6">
    HEBBOUL
  </text>

  <text x="69" y="179" fill="#C2CBD5"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21" font-weight="400"
        letter-spacing="3">
    ABDERRAHMANE CHOUAIB
  </text>

  <text x="69" y="222" fill="#527CA8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23" font-weight="500"
        letter-spacing="1.5">
    Software Engineering
  </text>

  <text x="69" y="248" fill="#AAB3BE"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12">
    Computer Science student. Building through practice.
  </text>

  <path d="M65 270H1135" stroke="#7897B8"
        stroke-opacity="0.3"/>

  <g fill="#7897B8" font-family="Arial, Helvetica, sans-serif"
     font-size="10" letter-spacing="2">
    <text x="65" y="288">CODE / CREATE / LEARN</text>
    <text x="1135" y="288" text-anchor="end">USTHB · ALGIERS</text>
  </g>
